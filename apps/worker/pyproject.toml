[project]
name = "repo-digest-worker"
version = "0.1.0"
description = "Worker serving the repo-digest workflow (GitHub catch-up digest posted to Slack self-DM)"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.19.0",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
